# Custom Nginx configuration for white-label error handling
# This file should be used when deploying with a reverse proxy

server {
    listen 80;
    server_name www.greatorsoftware.com greatorsoftware.com;
    
    # Custom error pages to hide Replit branding
    error_page 503 502 500 /503.html;
    error_page 404 /404.html;
    
    # Serve static error pages from your application
    location = /503.html {
        root /app/public;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    location = /404.html {
        root /app/public;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Proxy to your Replit application
    location / {
        proxy_pass https://your-repl-url.replit.dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Custom timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Handle server failures gracefully
        proxy_intercept_errors on;
        
        # Fallback for when upstream is down
        error_page 502 503 504 =503 /503.html;
    }
}

# HTTPS redirect (optional)
server {
    listen 443 ssl;
    server_name www.greatorsoftware.com greatorsoftware.com;
    
    # SSL certificate configuration
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    
    # Same configuration as above for HTTPS
    error_page 503 502 500 /503.html;
    error_page 404 /404.html;
    
    location = /503.html {
        root /app/public;
        internal;
    }
    
    location / {
        proxy_pass https://your-repl-url.replit.dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        
        error_page 502 503 504 =503 /503.html;
    }
}