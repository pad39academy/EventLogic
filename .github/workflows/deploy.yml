name: Deploy to Google Cloud Run

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_ID: ievolve-sports-2025
  REGION: asia-south1
  SERVICE_NAME: ievolve-app
  IMAGE_REGISTRY: asia-south1-docker.pkg.dev
  REPOSITORY: ievolve-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.PROJECT_ID }}
        
    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
      
    - name: Build Docker image
      run: |
        docker buildx build \
          --no-cache \
          --platform linux/amd64 \
          -f Dockerfile-fixed \
          -t ${{ env.IMAGE_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.VERSION }} \
          .
          
    - name: Push Docker image
      run: |
        docker push ${{ env.IMAGE_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.VERSION }}
        
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=${{ env.IMAGE_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.VERSION }} \
          --region=${{ env.REGION }} \
          --allow-unauthenticated \
          --set-env-vars="DATABASE_URL=postgresql://ievolve_user:IevolveSecure2025!@/ievolve_db?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:ievolve-db,NODE_ENV=production" \
          --add-cloudsql-instances="${{ env.PROJECT_ID }}:${{ env.REGION }}:ievolve-db" \
          --set-secrets="TWILIO_ACCOUNT_SID=twilio-account-sid:latest,TWILIO_AUTH_TOKEN=twilio-auth-token:latest,TWILIO_PHONE_NUMBER=twilio-phone-number:latest" \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --project=${{ env.PROJECT_ID }}
          
    - name: Get service URL
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="value(status.url)" --project=${{ env.PROJECT_ID }})
        echo "🌐 Deployed version ${{ env.VERSION }} to: $SERVICE_URL"